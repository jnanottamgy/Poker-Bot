name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jpb
          POSTGRES_PASSWORD: jpb
          POSTGRES_DB: jpb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jpb" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://jpb:jpb@localhost:5432/jpb_test
      TEST_REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The browser end-to-end test (tests/e2e/player-browser.test.ts) drives Chromium.
      - run: env -u PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
