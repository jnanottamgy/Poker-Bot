# Horizontally scaled topology on one or more Docker hosts (still free/OSS):
# gateways (HTTP + WebSockets) behind nginx, table workers, one orchestrator,
# Redis for pub/sub + leases, PostgreSQL for authoritative state.
#
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.scaled.yml up -d --scale gateway=3 --scale worker=4
#
# Size the pools with tests/load before an event; see docs/SCALING.md.
services:
  app:
    profiles: ['single-node-only']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  gateway:
    image: johnnys-poker-bot:latest
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    environment: &env
      NODE_ENV: production
      DATABASE_URL: postgres://jpb:${POSTGRES_PASSWORD}@postgres:5432/jpb
      REDIS_URL: redis://redis:6379
      SEED_ENCRYPTION_KEY: ${SEED_ENCRYPTION_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_INSECURE_LAN_HTTP: ${ALLOW_INSECURE_LAN_HTTP:-false}
      TRUST_PROXY: 'true'
      NODE_ROLE: gateway

  worker:
    image: johnnys-poker-bot:latest
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    environment:
      <<: *env
      NODE_ROLE: worker

  orchestrator:
    image: johnnys-poker-bot:latest
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    environment:
      <<: *env
      NODE_ROLE: orchestrator

  lb:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [gateway]
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${APP_PORT:-8080}:8080'
