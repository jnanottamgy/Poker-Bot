# Load balancer for gateway nodes. WebSockets are long-lived; ip_hash keeps a
# client on one gateway between reconnects (not required for correctness —
# any gateway can serve any client — but it keeps per-connection rate limits
# meaningful and reduces session cache misses).
events { worker_connections 65536; }
http {
  upstream gateways {
    ip_hash;
    server gateway:8080 max_fails=3 fail_timeout=5s;
    keepalive 64;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    client_max_body_size 64k;
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}
