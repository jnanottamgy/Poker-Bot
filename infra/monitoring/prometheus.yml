global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: johnnys-poker-bot
    metrics_path: /metrics
    # The token file is written by scripts/setup-env.mjs (same value as METRICS_TOKEN in .env).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['app:8080']
