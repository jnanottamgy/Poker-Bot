global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: johnnys-poker-bot
    metrics_path: /metrics
    # Set METRICS_TOKEN in .env and paste it here (Prometheus does not expand env vars in this file).
    authorization:
      type: Bearer
      credentials: REPLACE_WITH_METRICS_TOKEN
    static_configs:
      - targets: ['app:8080']
