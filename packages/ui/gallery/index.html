<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>@jpb/ui — Gallery</title>
    <style>
      body { margin: 0; background: #0a0b0d; }
      .g-wrap { max-width: 1320px; margin: 0 auto; padding: 32px 24px 80px; }
      .g-nav { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 24px; border-bottom: 1px solid var(--jpb-border); background: rgba(10,11,13,.9); backdrop-filter: blur(8px); }
      .g-nav a { padding: 6px 10px; border-radius: 8px; color: var(--jpb-text-2); font-size: 13px; text-decoration: none; }
      .g-nav a:hover { background: var(--jpb-neutral-soft); color: var(--jpb-text); }
      .g-nav .g-toggles { display: flex; gap: 6px; margin-left: auto; }
      .g-nav button { padding: 6px 10px; border: 1px solid var(--jpb-border-strong); border-radius: 8px; background: transparent; color: var(--jpb-text-2); font: inherit; font-size: 12px; cursor: pointer; }
      .g-nav button[aria-pressed='true'] { color: var(--jpb-accent); border-color: var(--jpb-accent-line); }
      .g-section { padding: 8px 0 48px; }
      .g-section + .g-section { border-top: 1px solid var(--jpb-border); padding-top: 40px; }
      .g-eyebrow { color: var(--jpb-accent); font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      .g-h2 { margin: 6px 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
      .g-lede { margin-bottom: 28px; color: var(--jpb-text-2); max-width: 70ch; }
      .g-h3 { margin: 28px 0 12px; color: var(--jpb-text-muted); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      .g-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      .g-row--top { align-items: flex-start; }
      .g-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
      .g-grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
      .g-grid--kpi { grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: 12px; }
      .g-stack { display: grid; gap: 12px; }
      .g-card { padding: 20px; border: 1px solid var(--jpb-border); border-radius: 16px; background: var(--jpb-surface); }
      .g-label { margin-bottom: 8px; color: var(--jpb-text-muted); font-size: 12px; }
      .g-phone { width: 100%; max-width: 430px; margin: 0 auto; display: grid; gap: 10px; }
      .g-phone-frame { padding: 12px; border: 1px solid var(--jpb-border); border-radius: 36px; background: var(--jpb-bg); }
      .g-phones { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; }
      .g-phones > .g-phone-frame { flex: 1 1 360px; max-width: 430px; }
      .g-ptop { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px; }
      .g-brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
      .g-brand i { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--jpb-accent); color: var(--jpb-accent-ink); font-style: normal; }
      .g-swatch { display: grid; gap: 6px; }
      .g-swatch span:first-child { height: 64px; border-radius: 12px; border: 1px solid var(--jpb-border-strong); }
      .g-swatch b { font-size: 13px; }
      .g-swatch code { color: var(--jpb-text-muted); font-size: 11px; }
      .g-admin-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); }
      .g-controls { display: grid; gap: 12px; }
      @media (max-width: 1100px) { .g-admin-grid { grid-template-columns: minmax(0, 1fr); } }
      .g-broadcast { padding: 32px; border-radius: 28px; background: #050506; border: 1px solid var(--jpb-border); display: grid; gap: 24px; }
      .g-broadcast-grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
      @media (max-width: 900px) { .g-broadcast-grid { grid-template-columns: minmax(0,1fr); } }
      .g-solo { padding: 0; }
      .g-solo .g-wrap { padding: 16px 12px 40px; }
      @media (max-width: 600px) { .g-wrap { padding: 20px 12px 60px; } .g-h2 { font-size: 24px; } .g-card { padding: 14px; } .g-phone-frame { padding: 0; border: 0; } }
    </style>
  </head>
  <body class="jpb-app">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
